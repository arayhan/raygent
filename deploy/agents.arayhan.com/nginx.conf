# /etc/nginx/sites-available/raygent-hub, linked from sites-enabled.
# agents.arayhan.com: the root is the agents' site (a placeholder until the
# Office of step 5), and /api/ is `raygent hub serve` on 127.0.0.1:3300, which
# checks its own bearer token on every route except /api/health.
# The TLS lines were written by `certbot --nginx -d agents.arayhan.com`.
server {
    server_name agents.arayhan.com;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Server-sent events: pass each event through as it comes and keep the connection open.
    location /api/stream {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The agents' site. Unknown paths fall back to index.html, ready for the
    # Office's client-side routes.
    location / {
        root /var/www/agents.arayhan.com;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agents.arayhan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agents.arayhan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = agents.arayhan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name agents.arayhan.com;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
