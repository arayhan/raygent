<!-- raygent mark, "prompt": the agent prompt chevron, its cursor a yellow dot, on the blue tile.
     The heavy drawing, since a favicon shows at 16 and 32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="raygent">
  <rect width="64" height="64" rx="16" fill="#3d6bf0" />
  <path d="M20 19 L33 32 L20 45" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="45" cy="45" r="6.5" fill="#f5c431" />
</svg>
